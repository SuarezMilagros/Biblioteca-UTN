{% comment %}
    Insignia del estado de un ejemplar. Requiere la variable `ejemplar`.
{% endcomment %}
{% if not ejemplar.activo %}<span class="badge badge-baja">Dado de baja</span>{% elif ejemplar.prestado %}<span class="badge badge-prestado">Prestado</span>{% elif ejemplar.apartado %}<span class="badge badge-info">Apartado</span>{% else %}<span class="badge badge-disponible">Disponible</span>{% endif %}
