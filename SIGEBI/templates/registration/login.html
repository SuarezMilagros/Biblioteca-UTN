{% extends 'base.html' %}

{% block titulo %}Ingresar · SIGEBI{% endblock %}

{% block contenido %}
<section class="tarjeta tarjeta-centrada">
    <h1>Ingresar</h1>

    {% if form.errors %}
    <div class="alerta-error">
        <p>El usuario o la contraseña no son correctos.</p>
    </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}" class="formulario">
        {% csrf_token %}
        <div class="campo">
            <label for="{{ form.username.id_for_label }}">Usuario</label>
            {{ form.username }}
        </div>
        <div class="campo">
            <label for="{{ form.password.id_for_label }}">Contraseña</label>
            {{ form.password }}
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <div class="acciones-formulario">
            <button type="submit" class="boton">Ingresar</button>
        </div>
    </form>
</section>
{% endblock %}
